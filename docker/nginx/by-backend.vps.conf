# BOLAYETU Backend — native VPS Nginx site
#
# Copy to the VPS:
#   sudo cp docker/nginx/by-backend.vps.conf /etc/nginx/sites-available/bolayetu-api
#   sudo ln -s /etc/nginx/sites-available/bolayetu-api /etc/nginx/sites-enabled/bolayetu-api
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites:
#   - by-backend app is published on 127.0.0.1:8000.
#   - DNS A/AAAA record for workspace.bolayetu.com points to this VPS.
#   - Certbot has issued certificates for workspace.bolayetu.com:
#       sudo certbot --nginx -d workspace.bolayetu.com
#
# Media files are served by the configured Cloudflare R2/CDN storage. Django
# and WhiteNoise serve API responses and collected static assets.

upstream by_backend_app {
    server 127.0.0.1:8008;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name workspace.bolayetu.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name workspace.bolayetu.com;

    ssl_certificate /etc/letsencrypt/live/workspace.bolayetu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workspace.bolayetu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;

    location = /health {
        access_log off;
        proxy_pass http://by_backend_app/api/v1/health/;
        proxy_read_timeout 10s;
    }

    location = /api/v1/health/liveness/ {
        access_log off;
        proxy_pass http://by_backend_app;
        proxy_read_timeout 10s;
    }

    location = /api/v1/health/readiness/ {
        access_log off;
        proxy_pass http://by_backend_app;
        proxy_read_timeout 10s;
    }

    # Server-Sent Events must remain unbuffered for notification and match streams.
    location ~ ^/api/v1/(notifications/stream/|competitions/matches/[^/]+/stream/) {
        proxy_pass http://by_backend_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://by_backend_app;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
